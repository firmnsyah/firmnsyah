name: GitHub Metrics

on:
  # Refresh every 12 hours
  schedule:
    - cron: "0 */12 * * *"
  # Manual run from the Actions tab
  workflow_dispatch:
  # Run on push to main
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      # ---- Stats overview + languages (replaces stats & top-langs cards) ----
      - name: Overview metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: github-metrics.svg
          template: classic
          base: header, activity, community, repositories, metadata
          config_timezone: Asia/Makassar
          config_animations: yes
          plugin_languages: yes
          plugin_languages_analysis_timeout: 15
          plugin_languages_categories: markup, programming
          plugin_languages_colors: "0:00F5A0, 1:00D9F5, 2:00C9A7, 3:00B894, 4:0AE2C0, 5:1DE9B6, 6:64FFDA, 7:00E5FF"
          plugin_languages_limit: 8
          plugin_languages_sort: size
          extras_css: |
            h2, .field-name { color: #00F5A0 !important; }
            a { color: #00D9F5 !important; }
            .badge, .key { color: #00C9A7 !important; }

      # ---- Achievements (replaces the trophies card) ----
      - name: Achievements metrics
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: github-achievements.svg
          base: ""
          config_animations: yes
          plugin_achievements: yes
          plugin_achievements_display: detailed
          plugin_achievements_secrets: no
          plugin_achievements_threshold: C
          extras_css: |
            h2, .field-name { color: #00F5A0 !important; }
            a { color: #00D9F5 !important; }
            .achievement .title { color: #00F5A0 !important; }
            .achievement .progress .current { color: #00D9F5 !important; }
